name: Build DualPulse

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build DualPulse
      run: dotnet build src/DualPulse.slnx -c Release

    - name: Test DualPulse Core
      run: dotnet test --project src/DualPulse.Core.Tests -c Release

    - name: Test DualPulse App
      run: dotnet test --project src/DualPulse.App.Tests -c Release

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: DualPulse
        path: src/DualPulse.App/bin/Release/net10.0/win-x64/
        retention-days: 90
